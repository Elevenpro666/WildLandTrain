  <text x="263" y="174" text-anchor="middle" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#53646b">↑ 行驶方向</text>
  <text x="768" y="174" text-anchor="middle" font-size="17" font-family="Microsoft YaHei, sans-serif" fill="#53646b">↑ 行驶方向</text>

