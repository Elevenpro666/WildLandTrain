<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="车头与车厢武器挂载分区草案">
  <rect width="1080" height="650" fill="#f2efe6"/>
  <text x="44" y="49" font-size="27" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#243138">武器挂载分区草案 · 正俯视</text>
  <text x="44" y="77" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#5a6565">蓝：车顶核心位 T　橙：成对侧挂位 L/R　绿：后向推进位 P　灰：不可安装/需避让</text>
  <text x="44" y="102" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#7b5a4d">示意不等于正式装配上限；尺寸范围与冲突见配套规划文档</text>
  <text x="263" y="145" text-anchor="middle" font-size="23" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#243138">车头</text>
