  <line x1="507" y1="185" x2="507" y2="557" stroke="#abb3b2" stroke-width="2" stroke-dasharray="6 7"/>
  <rect x="41" y="605" width="998" height="28" rx="5" fill="#e4e1d8"/>
  <text x="540" y="624" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#414e51">T：核心/机舱　L/R：左右侧挂及外伸　P：独立助推器；同排冲突需在极限装载测试中确认</text>
