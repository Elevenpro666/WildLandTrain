<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc">
  <title id="title">荒野列车武器装配槽位线稿 V0.2</title>
  <desc id="desc">正俯视线稿，展示车头2/4/6槽、车厢4/6/8个T面接口、车头车厢等宽与贴体轮组，并列出五个武器系列的T面安装映射。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26343a}.title{font-size:32px;font-weight:700}.subtitle{font-size:16px;fill:#52636b}.head{font-size:20px;font-weight:700}.lab{font-size:14px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#52636b}.vehicle{fill:#f3f1e9;stroke:#34444b;stroke-width:3}.seam{stroke:#82908e;stroke-width:1.6;fill:none}.slot{fill:#fffefa;stroke:#364a50;stroke-width:2.4}.slotid{font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.side{fill:#d8eeeb;stroke:#258188;stroke-width:2}.link{stroke:#258188;stroke-width:1.5;stroke-dasharray:4 3}.card{fill:#fffefa;stroke:#ccd4d0;stroke-width:2}.tag{fill:#edf1ed;stroke:#c5d1cc;stroke-width:1.4}.cut{fill:#b45d42}.arc{fill:#3984a0}.drone{fill:#678a5a}.deny{fill:#bd8c36}.pierce{fill:#675f9d}.tire{fill:#465154;stroke:#26343a;stroke-width:2}.tread{stroke:#a9b0aa;stroke-width:1.3;stroke-linecap:round}.axle{stroke:#657578;stroke-width:3}.keepout{fill:#dbd8cd;fill-opacity:.55;stroke:#8c7b50;stroke-width:1.4;stroke-dasharray:4 3}
    </style>
    <g id="wheelpair"><path class="axle" d="M-78 0h156"/><rect class="keepout" x="-91" y="-21" width="26" height="42" rx="5"/><rect class="keepout" x="65" y="-21" width="26" height="42" rx="5"/><rect class="tire" x="-85" y="-15" width="14" height="30" rx="4"/><path class="tread" d="M-83 -8h10M-83 0h10M-83 8h10"/><rect class="tire" x="71" y="-15" width="14" height="30" rx="4"/><path class="tread" d="M73 -8h10M73 0h10M73 8h10"/></g>
    <g id="head-outline"><use href="#wheelpair" transform="translate(0 34)"/><use href="#wheelpair" transform="translate(0 154)"/><path class="vehicle" d="M-58 0h116l13 20v156l-13 20H-58l-13-20V20z"/><path class="seam" d="M-50 30v126M50 30v126M-60 31h120M-60 157h120"/><path d="M-39 9h78l-10 13h-58z" fill="#dfe4df" stroke="#34444b" stroke-width="2"/><path d="M-12 197h24v15h-6v13h-12v-13h-6z" fill="#d7dad3" stroke="#34444b" stroke-width="2"/></g>
    <g id="car-outline"><use href="#wheelpair" transform="translate(0 61)"/><use href="#wheelpair" transform="translate(0 184)"/><path class="vehicle" d="M-63 0h126l8 20v205l-8 20h-126l-8-20V20z"/><path class="seam" d="M-61 27v205M61 27v205M-65 28h130M-65 232h130"/><path d="M-12 247h24v15h-6v13h-12v-13h-6z" fill="#d7dad3" stroke="#34444b" stroke-width="2"/></g>
    <g id="cell"><rect class="slot" x="-20" y="-13" width="40" height="26" rx="5"/></g>
  </defs>
  <rect width="1440" height="1180" fill="#f4f2eb"/>
  <text x="48" y="55" class="title">武器装配槽位线稿｜V0.2 正俯视</text>
  <text x="50" y="84" class="subtitle">最大编组：1车头 + 4车厢。车头2/4/6槽，单节车厢4/6/8槽；所有武器统一安装在顶面T槽。车头与车厢等宽，轮组贴合车体两侧。</text>
  <rect x="42" y="110" width="1356" height="655" rx="18" class="card"/>
  <text x="68" y="148" class="head">车头接口成长｜T面</text>
  <text x="68" y="177" class="small">车头朝上；保持2列左右对称，每级沿纵向增一排并拉长车体以容纳接口。车头/车厢外宽统一；深灰长矩形为俯视轮胎，横线为轴，虚线框为轮组避让区。</text>

  <!-- Head cards -->
  <g transform="translate(300 208)">
    <text x="0" y="-20" text-anchor="middle" class="lab">Lv.1｜2槽</text><use href="#head-outline" transform="scale(1 .62)"/>
    <use href="#cell" transform="translate(-31 60)"/><text class="slotid" x="-31" y="60">H1</text>
    <use href="#cell" transform="translate(31 60)"/><text class="slotid" x="31" y="60">H2</text>
    <text x="0" y="247" text-anchor="middle" class="small">2列 × 1排</text>
  </g>
  <g transform="translate(710 208)">
    <text x="0" y="-20" text-anchor="middle" class="lab">Lv.2｜4槽</text><use href="#head-outline" transform="scale(1 .78)"/>
    <use href="#cell" transform="translate(-31 53)"/><text class="slotid" x="-31" y="53">H1</text><use href="#cell" transform="translate(31 53)"/><text class="slotid" x="31" y="53">H2</text>
    <use href="#cell" transform="translate(-31 119)"/><text class="slotid" x="-31" y="119">H3</text><use href="#cell" transform="translate(31 119)"/><text class="slotid" x="31" y="119">H4</text>
    <text x="0" y="247" text-anchor="middle" class="small">2列 × 2排</text>
  </g>
  <g transform="translate(1120 208)">
    <text x="0" y="-20" text-anchor="middle" class="lab">Lv.3｜6槽</text><use href="#head-outline"/>
    <use href="#cell" transform="translate(-31 40)"/><text class="slotid" x="-31" y="40">H1</text><use href="#cell" transform="translate(31 40)"/><text class="slotid" x="31" y="40">H2</text>
    <use href="#cell" transform="translate(-31 96)"/><text class="slotid" x="-31" y="96">H3</text><use href="#cell" transform="translate(31 96)"/><text class="slotid" x="31" y="96">H4</text>
    <use href="#cell" transform="translate(-31 152)"/><text class="slotid" x="-31" y="152">H5</text><use href="#cell" transform="translate(31 152)"/><text class="slotid" x="31" y="152">H6</text>
    <text x="0" y="247" text-anchor="middle" class="small">2列 × 3排</text>
  </g>

  <path d="M68 480h1304" stroke="#d8dfda" stroke-width="2"/>
  <text x="68" y="516" class="head">车厢接口成长｜仅保留T顶面槽</text>
  <text x="68" y="543" class="small">取消侧壁S槽，所有武器均从车体顶面接口安装。两组轮轴内收至车长约25%/75%处并左右对称；胎面贴合车体外缘，轮区用虚线框标示。</text>

  <!-- Wagon samples, strict top-down orientation; all weapon interfaces are on the T face -->
  <g transform="translate(290 565)">
    <text x="0" y="-8" text-anchor="middle" class="lab">Lv.1｜4槽</text>
    <use href="#wheelpair" transform="translate(0 30) scale(1 .72)"/><use href="#wheelpair" transform="translate(0 84) scale(1 .72)"/>
    <path d="M-63 4h126l8 12v82l-8 12h-126l-8-12V16z" fill="#f0eee6" stroke="#34444b" stroke-width="2.2"/>
    <path class="seam" d="M-60 20v84M60 20v84"/>
    <use href="#cell" transform="translate(-31 38)"/><text class="slotid" x="-31" y="38">C1</text><use href="#cell" transform="translate(31 38)"/><text class="slotid" x="31" y="38">C2</text>
    <use href="#cell" transform="translate(-31 76)"/><text class="slotid" x="-31" y="76">C3</text><use href="#cell" transform="translate(31 76)"/><text class="slotid" x="31" y="76">C4</text>
    <text x="0" y="130" text-anchor="middle" class="small">2列 × 2排</text>
  </g>
  <g transform="translate(715 565)">
    <text x="0" y="-8" text-anchor="middle" class="lab">Lv.2｜6槽</text>
    <use href="#wheelpair" transform="translate(0 36) scale(1 .72)"/><use href="#wheelpair" transform="translate(0 100) scale(1 .72)"/>
    <path d="M-63 4h126l8 12v104l-8 12h-126l-8-12V16z" fill="#f0eee6" stroke="#34444b" stroke-width="2.2"/>
    <path class="seam" d="M-60 20v100M60 20v100"/>
    <use href="#cell" transform="translate(-31 32)"/><text class="slotid" x="-31" y="32">C1</text><use href="#cell" transform="translate(31 32)"/><text class="slotid" x="31" y="32">C2</text>
    <use href="#cell" transform="translate(-31 70)"/><text class="slotid" x="-31" y="70">C3</text><use href="#cell" transform="translate(31 70)"/><text class="slotid" x="31" y="70">C4</text>
    <use href="#cell" transform="translate(-31 108)"/><text class="slotid" x="-31" y="108">C5</text><use href="#cell" transform="translate(31 108)"/><text class="slotid" x="31" y="108">C6</text>
    <text x="0" y="152" text-anchor="middle" class="small">2列 × 3排</text>
  </g>
  <g transform="translate(1140 565)">
    <text x="0" y="-8" text-anchor="middle" class="lab">Lv.3｜8槽</text>
    <use href="#wheelpair" transform="translate(0 42) scale(1 .72)"/><use href="#wheelpair" transform="translate(0 116) scale(1 .72)"/>
    <path d="M-63 4h126l8 12v126l-8 12h-126l-8-12V16z" fill="#f0eee6" stroke="#34444b" stroke-width="2.2"/>
    <path class="seam" d="M-60 20v122M60 20v122"/>
    <use href="#cell" transform="translate(-31 28)"/><text class="slotid" x="-31" y="28">C1</text><use href="#cell" transform="translate(31 28)"/><text class="slotid" x="31" y="28">C2</text>
    <use href="#cell" transform="translate(-31 60)"/><text class="slotid" x="-31" y="60">C3</text><use href="#cell" transform="translate(31 60)"/><text class="slotid" x="31" y="60">C4</text>
    <use href="#cell" transform="translate(-31 92)"/><text class="slotid" x="-31" y="92">C5</text><use href="#cell" transform="translate(31 92)"/><text class="slotid" x="31" y="92">C6</text>
    <use href="#cell" transform="translate(-31 124)"/><text class="slotid" x="-31" y="124">C7</text><use href="#cell" transform="translate(31 124)"/><text class="slotid" x="31" y="124">C8</text>
    <text x="0" y="172" text-anchor="middle" class="small">2列 × 4排</text>
  </g>

  <rect x="42" y="785" width="1356" height="470" rx="18" class="card"/>
  <text x="68" y="826" class="head">五武器系列如何落在接口上</text>
  <text x="68" y="853" class="small">色点用于区分系列；所有家族均通过T面接口安装，示意图表示接口与占槽数，不代表具体武器外形或运行净空已通过。</text>
  <g>
    <circle cx="93" cy="902" r="10" class="cut"/><text x="120" y="907" class="lab">机械切割</text><text x="300" y="907" class="body">车厢T面左右成对接口，计 2 槽；刀盘可向边缘布置，轮组与扫掠范围另核。</text>
    <circle cx="93" cy="967" r="10" class="arc"/><text x="120" y="972" class="lab">电磁传导</text><text x="300" y="972" class="body">车头或车厢T面，1个发生器计 1 槽；电弧链是攻击效果，不另占槽。</text>
    <circle cx="93" cy="1032" r="10" class="drone"/><text x="120" y="1037" class="lab">无人机作业</text><text x="300" y="1037" class="body">车头或车厢T面，1个机舱计 1 槽；升级出双机仍来自同一舱。</text>
    <circle cx="93" cy="1097" r="10" class="deny"/><text x="120" y="1102" class="lab">拒止 / 辐射地雷</text><text x="300" y="1102" class="body">车厢T面各占 1 槽；拒止器与投雷器是两种硬件，不可同槽叠装。</text>
    <circle cx="93" cy="1162" r="10" class="pierce"/><text x="120" y="1167" class="lab">T区穿透冲击</text><text x="300" y="1167" class="body">车头或车厢T面，紧凑发射器计 1 槽；前向弹道与实体分开校核。</text>
  </g>
  <rect x="68" y="1200" width="1304" height="36" rx="9" class="tag"/>
  <text x="86" y="1224" class="body">容量提示：整列同级 Lv.1 / Lv.2 / Lv.3 分别为 18 / 28 / 38 个接口；冲刺是车头内建功能，不占武器槽。</text>
  <text x="48" y="1285" class="small">车头与车厢外宽统一，轮胎胎面贴合车体外缘；比例为结构示意候选。武器实体/最大运行包络、刀盘行程、投雷落点、无人机轨迹及战斗镜头仍未验证。</text>
</svg>
