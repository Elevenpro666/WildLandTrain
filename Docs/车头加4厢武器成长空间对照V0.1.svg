<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#f3f0e8}.panel{fill:#fffdf8;stroke:#c9c3b5;stroke-width:2}.ink{fill:#26343a}.muted{fill:#657177}.blue{fill:#377ea0}.blue2{fill:#dcecf2}.green{fill:#4d8064}.green2{fill:#e1eee5}.gold{fill:#c98b32}.gold2{fill:#f5e9d1}.line{stroke:#a9b1ad;stroke-width:2}.small{font:18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.body{font:20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font:700 34px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.head{font:700 24px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.bold{font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text x="64" y="62" class="title ink">车头 + 4 节满级车厢：接口够不够？成长够不够？</text>
  <text x="64" y="98" class="body muted">把“同时装多少硬件”与“每件武器能成长多少”分开看｜候选账面评估，非运行版配置</text>

  <rect x="54" y="126" width="1332" height="365" rx="18" class="panel"/>
  <text x="82" y="166" class="head ink">A. 装配容量：36 个可见接口</text>
  <text x="82" y="196" class="small muted">车头 T 区 4 个；4 节 Lv.3 车厢各 8 个。T 区有类型限制，不等于全部通用。</text>
  <!-- Head -->
  <g transform="translate(92 226)">
    <rect x="0" y="0" width="150" height="92" rx="20" fill="#e4e7e4" stroke="#34434a" stroke-width="4"/>
    <path d="M12 18h126M12 74h126" stroke="#7d8989" stroke-width="3"/>
    <rect x="32" y="18" width="36" height="28" rx="5" class="blue"/><rect x="82" y="18" width="36" height="28" rx="5" class="blue"/>
    <rect x="32" y="50" width="36" height="28" rx="5" class="blue"/><rect x="82" y="50" width="36" height="28" rx="5" class="blue"/>
    <text x="75" y="122" text-anchor="middle" class="body ink bold">车头</text><text x="75" y="148" text-anchor="middle" class="small muted">4 个 T 接口</text>
  </g>
  <path d="M260 272H302" class="line"/><path d="M294 264l10 8-10 8" fill="none" stroke="#7d8989" stroke-width="3"/>
  <!-- Cars -->
  <g class="small ink" text-anchor="middle">
    <g transform="translate(320 222)"><rect width="204" height="110" rx="18" fill="#dfe5e5" stroke="#34434a" stroke-width="4"/><path d="M14 12v86M190 12v86" stroke="#7d8989" stroke-width="6"/><g fill="#377ea0"><rect x="58" y="13" width="34" height="34" rx="6"/><rect x="112" y="13" width="34" height="34" rx="6"/><rect x="58" y="59" width="34" height="34" rx="6"/><rect x="112" y="59" width="34" height="34" rx="6"/><rect x="18" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="166" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="46" y="34" width="18" height="28" rx="5" fill="#4d8064"/><rect x="146" y="34" width="18" height="28" rx="5" fill="#4d8064"/></g><text x="102" y="137" class="body bold">Lv.3 车厢 1</text><text x="102" y="163" class="small muted">8 接口｜约 6 点混合装配</text></g>
    <g transform="translate(574 222)"><rect width="204" height="110" rx="18" fill="#dfe5e5" stroke="#34434a" stroke-width="4"/><path d="M14 12v86M190 12v86" stroke="#7d8989" stroke-width="6"/><g fill="#377ea0"><rect x="58" y="13" width="34" height="34" rx="6"/><rect x="112" y="13" width="34" height="34" rx="6"/><rect x="58" y="59" width="34" height="34" rx="6"/><rect x="112" y="59" width="34" height="34" rx="6"/><rect x="18" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="166" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="46" y="34" width="18" height="28" rx="5" fill="#4d8064"/><rect x="146" y="34" width="18" height="28" rx="5" fill="#4d8064"/></g><text x="102" y="137" class="body bold">Lv.3 车厢 2</text><text x="102" y="163" class="small muted">8 接口｜约 6 点混合装配</text></g>
    <g transform="translate(828 222)"><rect width="204" height="110" rx="18" fill="#dfe5e5" stroke="#34434a" stroke-width="4"/><path d="M14 12v86M190 12v86" stroke="#7d8989" stroke-width="6"/><g fill="#377ea0"><rect x="58" y="13" width="34" height="34" rx="6"/><rect x="112" y="13" width="34" height="34" rx="6"/><rect x="58" y="59" width="34" height="34" rx="6"/><rect x="112" y="59" width="34" height="34" rx="6"/><rect x="18" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="166" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="46" y="34" width="18" height="28" rx="5" fill="#4d8064"/><rect x="146" y="34" width="18" height="28" rx="5" fill="#4d8064"/></g><text x="102" y="137" class="body bold">Lv.3 车厢 3</text><text x="102" y="163" class="small muted">8 接口｜约 6 点混合装配</text></g>
    <g transform="translate(1082 222)"><rect width="204" height="110" rx="18" fill="#dfe5e5" stroke="#34434a" stroke-width="4"/><path d="M14 12v86M190 12v86" stroke="#7d8989" stroke-width="6"/><g fill="#377ea0"><rect x="58" y="13" width="34" height="34" rx="6"/><rect x="112" y="13" width="34" height="34" rx="6"/><rect x="58" y="59" width="34" height="34" rx="6"/><rect x="112" y="59" width="34" height="34" rx="6"/><rect x="18" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="166" y="37" width="20" height="30" rx="5" fill="#c98b32"/><rect x="46" y="34" width="18" height="28" rx="5" fill="#4d8064"/><rect x="146" y="34" width="18" height="28" rx="5" fill="#4d8064"/></g><text x="102" y="137" class="body bold">Lv.3 车厢 4</text><text x="102" y="163" class="small muted">8 接口｜约 6 点混合装配</text></g>
  </g>
  <g transform="translate(84 418)">
    <rect x="0" y="0" width="1270" height="48" rx="12" class="green2" stroke="#abc3ae"/>
    <text x="22" y="31" class="body ink"><tspan class="bold">账面样例：</tspan>每厢约 6 点（切割轮成对占 2 + 其他家族各 1）→ 4 厢占 24/32；车厢余 8 点，另有车头 T 区 4 点。</text>
  </g>

  <rect x="54" y="514" width="650" height="314" rx="18" class="panel"/>
  <text x="82" y="555" class="head ink">B. 武器成长：升级通常不另占槽</text>
  <text x="82" y="586" class="small muted">20 个规划节点 = 5 家族 × 每族最多 4 个；两条路线各最多两步</text>
  <g transform="translate(86 618)">
    <g><rect x="0" y="0" width="108" height="70" rx="12" class="blue2"/><text x="54" y="30" text-anchor="middle" class="small ink bold">基础本体</text><text x="54" y="54" text-anchor="middle" class="small muted">占 1 个挂位</text></g>
    <path d="M118 35h30m-8-8 9 8-9 8" fill="none" stroke="#68777c" stroke-width="3"/>
    <g><rect x="157" y="0" width="108" height="70" rx="12" class="gold2"/><text x="211" y="30" text-anchor="middle" class="small ink bold">路线 A</text><text x="211" y="54" text-anchor="middle" class="small muted">强化/扩展</text></g>
    <g><rect x="157" y="89" width="108" height="70" rx="12" class="green2"/><text x="211" y="119" text-anchor="middle" class="small ink bold">路线 B</text><text x="211" y="143" text-anchor="middle" class="small muted">另一种打法</text></g>
    <path d="M275 35h30m-8-8 9 8-9 8M275 124h30m-8-8 9 8-9 8" fill="none" stroke="#68777c" stroke-width="3"/>
    <g><rect x="314" y="0" width="128" height="70" rx="12" fill="#e7e2d8"/><text x="378" y="30" text-anchor="middle" class="small ink bold">路线终点</text><text x="378" y="54" text-anchor="middle" class="small muted">改变实际行为</text></g>
    <g><rect x="314" y="89" width="128" height="70" rx="12" fill="#e7e2d8"/><text x="378" y="119" text-anchor="middle" class="small ink bold">路线终点</text><text x="378" y="143" text-anchor="middle" class="small muted">另一种战术身份</text></g>
  </g>
  <text x="84" y="805" class="small muted">默认原位升级；新增独立设备才占新接口。节点数不等于连续满级或已平衡。</text>

  <rect x="724" y="514" width="662" height="314" rx="18" class="panel"/>
  <text x="752" y="555" class="head ink">C. 判断：容量初步够，数值曲线还没过关</text>
  <circle cx="774" cy="604" r="8" class="green"/><text x="796" y="611" class="body ink"><tspan class="bold">接口容量：</tspan>36 个可见接口，账面可覆盖五家族混合和重复搭配。</text>
  <circle cx="774" cy="651" r="8" class="green"/><text x="796" y="658" class="body ink"><tspan class="bold">成长结构：</tspan>20 节点、两路线/家族，有基础选择空间。</text>
  <circle cx="774" cy="698" r="8" class="gold"/><text x="796" y="705" class="body ink"><tspan class="bold">数值空间：</tspan>还需逐节点定增量、上限、互斥和终点效果。</text>
  <circle cx="774" cy="745" r="8" fill="#a85b4d"/><text x="796" y="752" class="body ink"><tspan class="bold">关键未决：</tspan>Lv.3 旧容量 10 与候选 8 接口不一致。</text>
  <text x="752" y="797" class="small muted">结论：接口解决构筑宽度；升级曲线解决成长纵深。不能用前者替代后者。</text>

  <text x="64" y="867" class="small muted">口径提示：候选接口数；挂载组合仅作容量算术示例，未验证同厢实体/攻击包络，也未验证战斗或微信真机。</text>
</svg>
