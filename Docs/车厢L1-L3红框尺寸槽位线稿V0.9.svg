<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26343a}
      .title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#52636b}.head{font-size:20px;font-weight:700}
      .small{font-size:13px;fill:#52636b}.label{font-size:14px;font-weight:700}.card{fill:#fffefa;stroke:#ccd4d0;stroke-width:2}
      .body{fill:#f3f1e9;stroke:#34444b;stroke-width:3}.seam{fill:none;stroke:#82908e;stroke-width:1.4}
      .slot{fill:#fffefa;stroke:#34444b;stroke-width:2}.bolt{fill:#82908e}.bracket{fill:#8c9898;stroke:#34444b;stroke-width:1.5}
      .wheel{fill:#465154;stroke:#26343a;stroke-width:2}.tread{stroke:#a9b0aa;stroke-width:1.2;stroke-linecap:round}
    </style>
    <g id="slot"><rect class="slot" x="-10" y="-10" width="20" height="20" rx="2.5"/><circle class="bolt" cx="-7.2" cy="-7.2" r=".9"/><circle class="bolt" cx="7.2" cy="-7.2" r=".9"/><circle class="bolt" cx="-7.2" cy="7.2" r=".9"/><circle class="bolt" cx="7.2" cy="7.2" r=".9"/></g>
    <g id="wheel-pair">
      <rect class="bracket" x="-38" y="-4.5" width="4" height="9" rx="1.2"/><rect class="bracket" x="34" y="-4.5" width="4" height="9" rx="1.2"/>
      <rect class="wheel" x="-43" y="-5.5" width="8" height="11" rx="3"/><rect class="wheel" x="35" y="-5.5" width="8" height="11" rx="3"/>
      <path class="tread" d="M-41 -2.5h4m-4 5h4M37 -2.5h4m-4 5h4"/>
    </g>
  </defs>
  <rect width="900" height="570" fill="#f8f7f2"/>
  <text x="36" y="43" class="title">车厢L1—L3｜按红框尺寸重排装配槽</text>
  <text x="36" y="69" class="sub">正俯视 · 车宽70 B不变 · 武器槽包络20×20 B · 横纵中心距24×23 B · 车长不小于车宽</text>
  <g transform="translate(150 310)">
    <rect x="-132" y="-220" width="264" height="440" rx="14" class="card"/>
    <text y="-190" text-anchor="middle" class="head">L1｜紧凑基础厢</text><text y="-168" text-anchor="middle" class="small">4槽 · 2列×2排</text>
    <g transform="translate(0 -77) scale(2.2)">
      <path class="body" d="M-29 0-35 8v54l6 8h58l6-8V8l-6-8h-58z"/><path class="seam" d="M-27 8v54M27 8v54M-25 4h50M-25 66h50"/>
      <use href="#wheel-pair" transform="translate(0 17.5)"/><use href="#wheel-pair" transform="translate(0 52.5)"/>
      <use href="#slot" transform="translate(-12 23.5)"/><use href="#slot" transform="translate(12 23.5)"/><use href="#slot" transform="translate(-12 46.5)"/><use href="#slot" transform="translate(12 46.5)"/>
    </g>
    <text y="173" text-anchor="middle" class="label">70×70 B｜4槽</text><text y="194" text-anchor="middle" class="small">2列中心距24 B，槽间留4 B</text>
  </g>
  <g transform="translate(450 310)">
    <rect x="-132" y="-220" width="264" height="440" rx="14" class="card"/>
    <text y="-190" text-anchor="middle" class="head">L2｜纵向加一排</text><text y="-168" text-anchor="middle" class="small">6槽 · 2列×3排</text>
    <g transform="translate(0 -94.6) scale(2.2)">
      <path class="body" d="M-29 0-35 8v70l6 8h58l6-8V8l-6-8h-58z"/><path class="seam" d="M-27 8v70M27 8v70M-25 4h50M-25 82h50"/>
      <use href="#wheel-pair" transform="translate(0 21.5)"/><use href="#wheel-pair" transform="translate(0 64.5)"/>
      <use href="#slot" transform="translate(-12 20)"/><use href="#slot" transform="translate(12 20)"/><use href="#slot" transform="translate(-12 43)"/><use href="#slot" transform="translate(12 43)"/><use href="#slot" transform="translate(-12 66)"/><use href="#slot" transform="translate(12 66)"/>
    </g>
    <text y="173" text-anchor="middle" class="label">70×86 B｜6槽</text><text y="194" text-anchor="middle" class="small">再加一排，纵向留10 B端余量</text>
  </g>
  <g transform="translate(750 310)">
    <rect x="-132" y="-220" width="264" height="440" rx="14" class="card"/>
    <text y="-190" text-anchor="middle" class="head">L3｜纵向再加一排</text><text y="-168" text-anchor="middle" class="small">8槽 · 2列×4排</text>
    <g transform="translate(0 -119.9) scale(2.2)">
      <path class="body" d="M-29 0-35 8v93l6 8h58l6-8V8l-6-8h-58z"/><path class="seam" d="M-27 8v93M27 8v93M-25 4h50M-25 105h50"/>
      <use href="#wheel-pair" transform="translate(0 27.25)"/><use href="#wheel-pair" transform="translate(0 81.75)"/>
      <use href="#slot" transform="translate(-12 20)"/><use href="#slot" transform="translate(12 20)"/><use href="#slot" transform="translate(-12 43)"/><use href="#slot" transform="translate(12 43)"/><use href="#slot" transform="translate(-12 66)"/><use href="#slot" transform="translate(12 66)"/><use href="#slot" transform="translate(-12 89)"/><use href="#slot" transform="translate(12 89)"/>
    </g>
    <text y="173" text-anchor="middle" class="label">70×109 B｜8槽</text><text y="194" text-anchor="middle" class="small">再加一排，纵向留10 B端余量</text>
  </g>
  <path d="M32 548h836" stroke="#d3d8d3" stroke-width="2"/>
  <text x="450" y="559" text-anchor="middle" class="small">槽组纵向包络43/66/89 B；单槽按红框折算20×20 B。车壁不设武器挂点，外置轮组保留。</text>
</svg>
